<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Konfigurator AR | door | SERWIS-DRZWI.PRO</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --blue: #2563eb; --green: #22c55e; --bg: #0f172a; --text: #f8fafc; }
        
        html, body { 
            margin: 0; padding: 0;
            width: 100%; min-height: 100%;
            background: var(--bg); color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* WŁĄCZAMY PRZEWIJANIE, ŻEBY MOŻNA BYŁO ODSŁONIĆ DÓŁ */
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }
        
        /* Kontener modelu - ustalona wysokość, aby reszta mogła się przewijać */
        .viewer-container {
            width: 100%;
            height: 70vh; /* Zajmuje 70% ekranu, reszta na panel */
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }

        /* PASEK NARZĘDZI NA GÓRZE */
        .top-tools {
            position: absolute; top: calc(env(safe-area-inset-top) + 15px);
            left: 15px; right: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 1000;
        }
        .row { display: flex; justify-content: space-between; align-items: center; width: 100%; }

        .btn-back {
            background: rgba(255,255,255,0.15); color: white; padding: 10px 15px;
            border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 12px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        }

        /* PRZYCISK SAMEJ MIARKI (BEZ MODELU) */
        .btn-only-measure {
            background: white; color: black; border: none; padding: 12px 20px;
            border-radius: 50px; font-weight: 800; font-size: 12px;
            box-shadow: 0 5px 15px rgba(255,255,255,0.3); cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }

        /* PRZYCISK AR (Z MODELEM) */
        .btn-ar-custom {
            background: var(--blue); color: white; border: none; padding: 15px 25px;
            border-radius: 50px; font-weight: 800; font-size: 13px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4); cursor: pointer;
        }

        /* PANEL DOLNY - Z DUŻYM MARGINESEM NA SCROLL */
        .ui-panel {
            padding: 30px 25px calc(env(safe-area-inset-bottom) + 120px); 
            background: #1e293b; border-radius: 40px 40px 0 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: -30px; position: relative; z-index: 2000;
        }
        
        .color-label { font-size: 12px; opacity: 0.6; display: block; text-align: center; margin-bottom: 15px; letter-spacing: 1px; }
        .color-grid { display: flex; gap: 15px; margin-bottom: 30px; justify-content: center; }
        .dot { width: 55px; height: 55px; border-radius: 15px; cursor: pointer; border: 3px solid transparent; transition: 0.3s; }
        .dot.active { border-color: var(--blue); transform: scale(1.1); box-shadow: 0 0 15px rgba(37, 99, 235, 0.3); }

        .btn-main { 
            width: 100%; background: var(--green); color: white; border: none; 
            padding: 22px; border-radius: 18px; font-weight: 800; font-size: 16px;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

    <div class="viewer-container">
        <div class="top-tools">
            <div class="row">
                <a href="index.html" class="btn-back">⬅ POWRÓT</a>
                <button class="btn-only-measure" onclick="openIPhoneMeasure()">📏 TYLKO MIARKA</button>
            </div>
            <div style="display:flex; justify-content:center; margin-top:10px;">
                <model-viewer id="doorModel" src="door.glb" ios-src="door.usdz" ar ar-modes="webxr scene-viewer quick-look" camera-controls ar-scale="fixed">
                    <button slot="ar-button" class="btn-ar-custom">🚪 PRZYMIERZ DRZWI W AR</button>
                </model-viewer>
            </div>
        </div>
    </div>

    <div class="ui-panel">
        <span class="color-label">WYBIERZ KOLOR OKLEINY:</span>
        <div class="color-grid">
            <div class="dot active" style="background: #2c2c2c;" onclick="paint('#2c2c2c', 'Antracyt', 2850, this)"></div>
            <div class="dot" style="background: #5d4037;" onclick="paint('#5d4037', 'Orzech', 2700, this)"></div>
            <div class="dot" style="background: #a67c52;" onclick="paint('#a67c52', 'Dąb Złoty', 2750, this)"></div>
            <div class="dot" style="background: #ffffff;" onclick="paint('#ffffff', 'Biały', 2600, this)"></div>
        </div>
        <button class="btn-main" onclick="sendToService()">✅ DODAJ DO KOSZTORYSU</button>
    </div>

    <script>
        let currentData = { n: "Drzwi door (Antracyt)", p: 2850 };

        function paint(hex, name, price, el) {
            currentData = { n: "Drzwi door (" + name + ")", p: price };
            const mv = document.querySelector('#doorModel');
            if (mv.model) {
                mv.model.materials.forEach(mat => {
                    if (!mat.name.toLowerCase().includes('handle') && !mat.name.toLowerCase().includes('klamka')) {
                        mat.pbrMetallicRoughness.setBaseColorFactor(hex);
                    }
                });
            }
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        // Funkcja otwierająca aplikację Miarka (tylko iPhone)
        function openIPhoneMeasure() {
            if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
                // To wywołuje natywną aplikację Apple
                window.location.href = "nt-measure://";
                setTimeout(() => { window.location.href = "com.apple.measure://"; }, 500);
            } else {
                alert("Funkcja dostępna tylko na iPhone (aplikacja Miarka).");
            }
        }

        function sendToService() {
            let queue = JSON.parse(localStorage.getItem('services_queue') || "[]");
            queue.push(currentData);
            localStorage.setItem('services_queue', JSON.stringify(queue));
            // WAŻNE: Poprawiłem nazwę pliku docelowego na index.html, bo tak masz na GitHubie
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>

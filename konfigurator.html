<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Konfigurator AR | door</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --blue: #2563eb; --green: #22c55e; --bg: #0f172a; }
        
        body { 
            margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg); color: white; height: 100vh;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Kontener modelu - musi mieć określoną wysokość */
        .viewer-box {
            flex: 1; width: 100%; position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        model-viewer { width: 100%; height: 100%; }

        /* Przycisk AR - GŁÓWNY */
        .ar-trigger {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--blue); color: white; border: none; padding: 16px 32px;
            border-radius: 50px; font-weight: 800; font-size: 14px; z-index: 10;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.5);
        }

        /* Pasek powrotu */
        .nav-top {
            position: absolute; top: calc(env(safe-area-inset-top) + 15px);
            left: 20px; z-index: 20;
        }
        .btn-back {
            background: rgba(255,255,255,0.1); color: white; padding: 10px 20px;
            border-radius: 50px; text-decoration: none; font-size: 12px; backdrop-filter: blur(10px);
        }

        /* PANEL DOLNY - WYSOKO DLA SAFARI */
        .config-panel {
            background: #1e293b;
            padding: 25px 20px calc(env(safe-area-inset-bottom) + 40px);
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .colors { display: flex; gap: 15px; justify-content: center; margin-bottom: 25px; }
        .dot { 
            width: 50px; height: 50px; border-radius: 12px; cursor: pointer;
            border: 3px solid transparent; transition: 0.3s;
        }
        .dot.active { border-color: var(--blue); transform: scale(1.1); }

        .btn-save {
            width: 100%; background: var(--green); color: white; border: none;
            padding: 18px; border-radius: 15px; font-weight: 800; font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="nav-top">
        <a href="index.html" class="btn-back">⬅ POWRÓT</a>
    </div>

    <div class="viewer-box">
        <model-viewer id="door" 
            src="door.glb" 
            ios-src="door.usdz"
            ar ar-modes="quick-look webxr scene-viewer" 
            camera-controls 
            ar-scale="fixed"
            shadow-intensity="1">
            
            <button slot="ar-button" class="ar-trigger">📏 OTWÓRZ APARAT I MIARKĘ</button>
        </model-viewer>
    </div>

    <div class="config-panel">
        <div class="colors">
            <div class="dot active" style="background: #2c2c2c;" onclick="paint('#2c2c2c', 'Antracyt', 2850, this)"></div>
            <div class="dot" style="background: #5d4037;" onclick="paint('#5d4037', 'Orzech', 2700, this)"></div>
            <div class="dot" style="background: #a67c52;" onclick="paint('#a67c52', 'Dąb Złoty', 2750, this)"></div>
            <div class="dot" style="background: #ffffff;" onclick="paint('#ffffff', 'Biały', 2600, this)"></div>
        </div>
        <button class="btn-save" onclick="save()">✅ ZATWIERDŹ WYBÓR</button>
    </div>

    <script>
        let current = { n: "Drzwi door (Antracyt)", p: 2850 };

        function paint(hex, name, price, el) {
            current = { n: "Drzwi door (" + name + ")", p: price };
            const mv = document.querySelector('#door');
            if (mv.model) {
                mv.model.materials.forEach(mat => {
                    if (!mat.name.toLowerCase().includes('handle')) {
                        mat.pbrMetallicRoughness.setBaseColorFactor(hex);
                    }
                });
            }
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        function save() {
            let q = JSON.parse(localStorage.getItem('services_queue') || "[]");
            q.push(current);
            localStorage.setItem('services_queue', JSON.stringify(q));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

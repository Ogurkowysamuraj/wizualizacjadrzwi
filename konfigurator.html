<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Konfigurator AR | SERWIS-DRZWI.PRO</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #2563eb; /* Biznesowy niebieski */
            --bg: #f8fafc; /* Jasny szary dla lepszej widoczności kolorów */
            --panel: rgba(255, 255, 255, 0.98); 
            --accent: #16a34a; /* Zielony dla akcji (zamów pomiar) */
            --text: #1e293b;
        }

        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            color: var(--text);
        }

        /* Widok 3D na całą stronę */
        model-viewer { 
            width: 100%; 
            flex-grow: 1; 
            --poster-color: transparent;
            background: radial-gradient(#ffffff, #e2e8f0);
        }

        /* PRZYCISK AR NA GÓRZE - Specjalnie dla iPhone */
        .ar-top-bar {
            position: absolute;
            top: 20px; /* Standardowo */
            right: 20px;
            z-index: 1000;
        }

        .btn-ar {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 50px;
            font-weight: 700;
            box-shadow: 0 5px 20px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
        .btn-ar:hover { background: #1d4ed8; }

        /* Panel sterowania u dołu */
        .ui-panel { 
            position: absolute; 
            bottom: 30px; 
            left: 20px; 
            right: 20px; 
            background: var(--panel); 
            padding: 25px; 
            border-radius: 25px; 
            width: calc(100% - 70px); 
            border: 1px solid rgba(0,0,0,0.05); 
            z-index: 10; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            margin: 0 auto;
        }

        .title { margin: 0 0 5px 0; color: var(--text); font-weight: 700; font-size: 18px; }
        .subtitle { font-size: 13px; opacity: 0.7; margin-bottom: 20px; }
        
        /* Wybór kolorów */
        .color-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; opacity: 0.7; margin-bottom: 10px; display: block; color: var(--primary); }
        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
        .dot { 
            width: 100%; aspect-ratio: 1; 
            border-radius: 12px; cursor: pointer; 
            border: 3px solid #f1f5f9; transition: 0.2s; 
            position: relative;
        }
        .dot.active { border-color: var(--primary); transform: scale(1.1); box-shadow: 0 0 15px rgba(37, 99, 235, 0.2); }
        .dot:hover { border-color: #cbd5e1; }

        /* Podsumowanie i przycisk */
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        .price-label { font-size: 12px; opacity: 0.6; }
        .price-value { font-size: 20px; font-weight: 700; color: var(--primary); }
        
        .btn-action { 
            width: 100%; 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 18px; 
            border-radius: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            font-size: 15px;
            letter-spacing: 1px;
            margin-top: 15px;
        }
        .btn-action:hover { background: #15803d; }

        /* POPRAWKI DLA IPHONE (Safe Area) */
        @media (max-width: 768px) {
            /* Przycisk AR ląduje w "Safe Area" na górze iPhone 14 Pro Max */
            .ar-top-bar { top: calc(env(safe-area-inset-top) + 20px); }
            .ui-panel { bottom: calc(env(safe-area-inset-bottom) + 15px); }
            .btn-ar { padding: 12px 20px; font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="ar-top-bar">
        <model-viewer id="doorModel" src="door.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls shadow-intensity="1.5" auto-rotate exposure="1">
            <button slot="ar-button" class="btn-ar">📐 PRZYMIERZALNIA (AR)</button>
        </model-viewer>
    </div>

    <div class="ui-panel">
        <h2 class="title">Projektant Drzwi Premium</h2>
        <p class="subtitle">Wizualizacja montażu w Twoim domu</p>
        
        <span class="color-label">Wybierz okleinę:</span>
        <div class="color-grid">
            <div class="dot active" style="background: #2c2c2c;" onclick="changeColor('#2c2c2c', 'Antracyt Mat', 2850, this)"></div>
            <div class="dot" style="background: #5d4037;" onclick="changeColor('#5d4037', 'Orzech Włoski', 2700, this)"></div>
            <div class="dot" style="background: #a67c52;" onclick="changeColor('#a67c52', 'Dąb Złocisty', 2750, this)"></div>
            <div class="dot" style="background: #f5f5f5;" onclick="changeColor('#f5f5f5', 'Biały Skandynawski', 2600, this)"></div>
        </div>

        <div class="price-row">
            <div class="price-label">Szacunkowy koszt montażu:</div>
            <div class="price-value" id="currentPrice">2850 ZŁ</div>
        </div>

        <button class="btn-action" onclick="orderMeasurement()">✅ ZAMÓW BEZPŁATNY POMIAR</button>
    </div>

    <script>
        let selectedColor = "Antracyt Mat";
        let lastPrice = 2850;

        function changeColor(hex, name, price, el) {
            selectedColor = name;
            lastPrice = price;
            const mv = document.querySelector('#doorModel');
            if (mv.model) {
                // Ta część maluje tylko skrzydło drzwi (materiał Wood)
                // Klamka pozostaje metalowa
                const wood = mv.model.materials.find(m => m.name.includes('Wood'));
                if (wood) {
                    wood.pbrMetallicRoughness.setBaseColorFactor(hex);
                }
            }
            // Zmiana podświetlenia kropek
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            
            // Aktualizacja ceny
            document.querySelector('#currentPrice').innerText = price + " ZŁ";
        }

        function orderMeasurement() {
            // Przesyłamy wybrane opcje do Asystenta na stronie głównej
            const data = {
                nazwa: "Drzwi 3D Modern Prestige",
                opis: "Wymiar: Standard, Kolor: " + selectedColor,
                cena: lastPrice
            };
            localStorage.setItem('nowyElementKosztorysu', JSON.stringify(data));
            window.location.href = 'index.html';
        }

        // Inicjalizacja przy starcie
        window.onload = function() {
            const mv = document.querySelector('#doorModel');
            mv.addEventListener('load', () => {
                // Wymuś kolor startowy (Antracyt)
                changeColor('#2c2c2c', 'Antracyt Mat', 2850, document.querySelector('.dot.active'));
            });
        }
    </script>
</body>
</html>

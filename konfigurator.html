<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Konfigurator AR | door</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --blue: #2563eb; --green: #22c55e; --bg: #0f172a; }
        
        /* Naprawa przewijania i wysokości na iOS */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Kontener modelu 3D */
        .viewer-section {
            width: 100%; height: 65vh; position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }

        /* PASEK NARZĘDZI GÓRNY */
        .header-ui {
            position: absolute; top: calc(env(safe-area-inset-top) + 15px);
            left: 15px; right: 15px; display: flex; flex-direction: column; gap: 12px; z-index: 1000;
        }
        .header-row { display: flex; justify-content: space-between; align-items: center; }

        .btn-back {
            background: rgba(255,255,255,0.15); color: white; padding: 10px 16px;
            border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 11px;
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1);
        }

        /* PRZYCISK SAMEJ MIARKI (Bez modelu) */
        .btn-measure-only {
            background: #ffffff; color: #000000; border: none; padding: 12px 20px;
            border-radius: 50px; font-weight: 800; font-size: 11px;
            box-shadow: 0 5px 15px rgba(255,255,255,0.2); cursor: pointer;
        }

        /* PRZYCISK AR (Z modelem drzwi) */
        .btn-ar-launch {
            background: var(--blue); color: white; border: none; padding: 15px 25px;
            border-radius: 50px; font-weight: 800; font-size: 13px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4); cursor: pointer;
        }

        /* PANEL DOLNY - MAKSYMALNA WIDOCZNOŚĆ */
        .footer-ui {
            padding: 30px 20px calc(env(safe-area-inset-bottom) + 100px); 
            background: #1e293b; border-radius: 35px 35px 0 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: -30px; position: relative; z-index: 2000;
            text-align: center;
        }
        
        .color-grid { display: flex; gap: 12px; margin: 20px 0 30px; justify-content: center; }
        .dot { width: 55px; height: 55px; border-radius: 14px; cursor: pointer; border: 3px solid transparent; transition: 0.3s; }
        .dot.active { border-color: var(--blue); transform: scale(1.1); }

        .btn-confirm { 
            width: 100%; background: var(--green); color: white; border: none; 
            padding: 20px; border-radius: 16px; font-weight: 800; font-size: 16px;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

    <div class="viewer-section">
        <div class="header-ui">
            <div class="header-row">
                <a href="index.html" class="btn-back">⬅ POWRÓT</a>
                <button class="btn-measure-only" onclick="launchMeasure()">📏 TYLKO MIARKA</button>
            </div>
            
            <div style="display:flex; justify-content:center; margin-top:10px;">
                <model-viewer id="door" src="door.glb" ios-src="door.usdz" ar ar-modes="quick-look webxr scene-viewer" camera-controls ar-scale="fixed">
                    <button slot="ar-button" class="btn-ar-launch">🚪 PRZYMIERZ DRZWI (AR)</button>
                </model-viewer>
            </div>
        </div>
    </div>

    <div class="footer-ui">
        <p style="font-size: 12px; opacity: 0.5; text-transform: uppercase;">Wybierz kolor drzwi:</p>
        <div class="color-grid">
            <div class="dot active" style="background: #2c2c2c;" onclick="paint('#2c2c2c', 'Antracyt', 2850, this)"></div>
            <div class="dot" style="background: #5d4037;" onclick="paint('#5d4037', 'Orzech', 2700, this)"></div>
            <div class="dot" style="background: #a67c52;" onclick="paint('#a67c52', 'Dąb Złoty', 2750, this)"></div>
            <div class="dot" style="background: #ffffff;" onclick="paint('#ffffff', 'Biały', 2600, this)"></div>
        </div>
        <button class="btn-confirm" onclick="saveToOrder()">✅ ZATWIERDŹ WYBÓR</button>
        <p style="font-size: 11px; opacity: 0.3; margin-top: 15px;">(Jeśli nie widzisz przycisków, przesuń stronę w dół)</p>
    </div>

    <script>
        let selection = { n: "Drzwi door (Antracyt)", p: 2850 };

        function paint(hex, name, price, el) {
            selection = { n: "Drzwi door (" + name + ")", p: price };
            const mv = document.querySelector('#door');
            if (mv.model) {
                mv.model.materials.forEach(mat => {
                    if (!mat.name.toLowerCase().includes('handle')) {
                        mat.pbrMetallicRoughness.setBaseColorFactor(hex);
                    }
                });
            }
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        // NAPRAWIONA MIARKA - używamy schematu apple-measure://
        function launchMeasure() {
            if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
                // To jest najskuteczniejszy sposób na wywołanie aplikacji Miarka bez błędów Safari
                window.location.href = "apple-measure://";
                
                // Backup jeśli pierwszy zawiedzie
                setTimeout(() => {
                    window.location.href = "nt-measure://";
                }, 500);
            } else {
                alert("Funkcja Miarka AR jest dostępna na urządzeniach iPhone.");
            }
        }

        function saveToOrder() {
            let q = JSON.parse(localStorage.getItem('services_queue') || "[]");
            q.push(selection);
            localStorage.setItem('services_queue', JSON.stringify(q));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurator 3D AR | SERWIS-DRZWI.PRO</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #2563eb; --bg: #0f172a; --panel: rgba(30, 41, 59, 0.95); --accent: #38bdf8; }
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: white; overflow: hidden; height: 100vh; display: flex; }
        
        /* Kontener modelu 3D */
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            --poster-color: transparent;
        }
        
        .config-panel {
            position: absolute; left: 20px; top: 20px; bottom: 20px; width: 300px;
            background: var(--panel); backdrop-filter: blur(20px); border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1); padding: 25px; display: flex; flex-direction: column; z-index: 100;
        }

        .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
        .color-dot { width: 100%; aspect-ratio: 1; border-radius: 10px; cursor: pointer; border: 2px solid transparent; transition: 0.3s; }
        .color-dot.active { border-color: var(--accent); transform: scale(1.1); box-shadow: 0 0 10px var(--accent); }

        .btn-ar {
            position: absolute; bottom: 30px; right: 30px; background: var(--primary);
            color: white; border: none; padding: 15px 25px; border-radius: 50px;
            font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-save {
            width: 100%; background: #22c55e; color: white; border: none;
            padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: auto;
        }

        .back-link { position: absolute; top: 20px; right: 20px; color: white; text-decoration: none; z-index: 100; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 50px; font-weight: 700; }
    </style>
</head>
<body>

    <a href="index.html" class="back-link"><i class="fas fa-times"></i> ZAMKNIJ</a>

    <model-viewer id="doorModel"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Door/glTF-Binary/Door.glb?reload=1" 
        ar ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        exposure="1.2"
        auto-rotate>
        <button slot="ar-button" class="btn-ar"><i class="fas fa-vr-cardboard"></i> ZOBACZ W AR</button>
    </model-viewer>

    <div class="config-panel">
        <h2 style="color:var(--accent); margin-bottom:5px;">Projektant 3D</h2>
        <p style="font-size: 11px; opacity: 0.6; margin-bottom: 20px;">SKONFIGURUJ SWOJE DRZWI</p>
        
        <label style="font-size: 12px; font-weight: 700;">MODEL</label>
        <select id="modelSelect" onchange="updatePrice()" style="width:100%; padding:12px; border-radius:10px; background:#1e293b; color:white; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
            <option value="Modern Loft" data-price="3100">Modern Loft (3100 zł)</option>
            <option value="Classic Wood" data-price="2600">Classic Wood (2600 zł)</option>
            <option value="Premium Steel" data-price="4200">Premium Steel (4200 zł)</option>
        </select>

        <label style="font-size: 12px; font-weight: 700;">KOLOR OKLEINY</label>
        <div class="color-grid">
            <div class="color-dot active" title="Dąb" style="background: #a67c52;" onclick="changeColor('#a67c52', 'Dąb Naturalny', this)"></div>
            <div class="color-dot" title="Antracyt" style="background: #37474f;" onclick="changeColor('#37474f', 'Antracyt', this)"></div>
            <div class="color-dot" title="Orzech" style="background: #5d4037;" onclick="changeColor('#5d4037', 'Orzech', this)"></div>
            <div class="color-dot" title="Biały" style="background: #ffffff;" onclick="changeColor('#ffffff', 'Biały', this)"></div>
        </div>

        <div style="margin-top: 30px; padding: 20px; background: rgba(0,0,0,0.2); border-radius: 15px; text-align: center;">
            <span style="font-size: 12px; opacity: 0.7; display: block;">CENA ZESTAWU:</span>
            <span id="priceTag" style="font-size: 24px; font-weight: 800; color:var(--accent)">3100 zł</span>
        </div>

        <button class="btn-save" onclick="saveAndExit()">ZAPISZ I DODAJ DO WYCENY</button>
    </div>

    <script>
        let selectedColorName = "Dąb Naturalny";

        // Funkcja zmieniająca kolor modelu drzwi
        function changeColor(hex, name, el) {
            selectedColorName = name;
            const mv = document.querySelector('#doorModel');
            
            if (mv.model) {
                // W tym konkretnym modelu materiał drzwi nazywa się 'Door'
                const material = mv.model.materials.find(m => m.name.toLowerCase().includes('door'));
                if (material) {
                    material.pbrMetallicRoughness.setBaseColorFactor(hex);
                }
            }
            
            // Zmiana podświetlenia kropek
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        function updatePrice() {
            const sel = document.getElementById('modelSelect');
            const price = sel.options[sel.selectedIndex].dataset.price;
            document.getElementById('priceTag').innerText = price + " zł";
        }

        function saveAndExit() {
            const sel = document.getElementById('modelSelect');
            const price = parseInt(sel.options[sel.selectedIndex].dataset.price);
            
            const data = {
                nazwa: sel.value,
                opis: "Kolor: " + selectedColorName,
                cena: price
            };
            
            // Przesłanie danych do index.html
            localStorage.setItem('nowyElementKosztorysu', JSON.stringify(data));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

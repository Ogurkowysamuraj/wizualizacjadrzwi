<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Konfigurator AR | door</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --blue: #2563eb; --green: #22c55e; --bg: #0f172a; }
        
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: white; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden; overflow-y: auto;
        }

        /* NAGŁÓWEK */
        .header {
            padding: calc(env(safe-area-inset-top) + 15px) 20px 10px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; background: var(--bg);
        }

        .btn-back {
            background: rgba(255,255,255,0.1); color: white; padding: 10px 18px;
            border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 12px;
        }

        .btn-measure {
            background: white; color: black; border: none; padding: 10px 18px;
            border-radius: 50px; font-weight: 800; font-size: 11px;
        }

        /* OBSZAR MODELU 3D - Zwiększona stabilność renderowania */
        .canvas-container {
            width: 100%; height: 50vh; min-height: 350px;
            position: relative; overflow: hidden;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        model-viewer { 
            width: 100%; height: 100%; 
            display: block;
            --poster-color: transparent; 
        }

        /* PRZYCISK AR - Pływający nad modelem */
        .ar-float-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: var(--blue); color: white; border: none; padding: 15px 25px;
            border-radius: 50px; font-weight: 800; font-size: 13px; z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* PANEL DOLNY */
        .config-ui {
            padding: 30px 25px calc(env(safe-area-inset-bottom) + 100px); 
            background: #1e293b; border-radius: 40px 40px 0 0;
            margin-top: -30px; position: relative; z-index: 50;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.5);
        }
        
        .grid { display: flex; gap: 15px; margin: 20px 0 35px; justify-content: center; }
        .dot { 
            width: 55px; height: 55px; border-radius: 15px; cursor: pointer; 
            border: 3px solid transparent; transition: 0.3s;
        }
        .dot.active { border-color: var(--blue); transform: scale(1.1); }

        .btn-confirm { 
            width: 100%; background: var(--green); color: white; border: none; 
            padding: 20px; border-radius: 18px; font-weight: 800; font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="btn-back">⬅ POWRÓT</a>
        <button class="btn-measure" onclick="runMeasure()">📏 MIARKA IPHONE</button>
    </div>

    <div class="canvas-container">
        <model-viewer id="doorModel" 
            src="door.glb" 
            ios-src="door.usdz" 
            ar ar-modes="quick-look webxr scene-viewer" 
            camera-controls 
            ar-scale="fixed"
            auto-rotate
            shadow-intensity="1">
            
            <button slot="ar-button" class="ar-float-btn">🚪 ZOBACZ W POKOJU (AR)</button>
        </model-viewer>
    </div>

    <div class="config-ui">
        <p style="text-align:center; font-size:12px; opacity:0.5; letter-spacing:1px;">DOSTĘPNE KOLORY:</p>
        <div class="grid">
            <div class="dot active" style="background: #2c2c2c;" onclick="setDoorColor('#2c2c2c', 'Antracyt', 2850, this)"></div>
            <div class="dot" style="background: #5d4037;" onclick="setDoorColor('#5d4037', 'Orzech', 2700, this)"></div>
            <div class="dot" style="background: #a67c52;" onclick="setDoorColor('#a67c52', 'Dąb Złoty', 2750, this)"></div>
            <div class="dot" style="background: #ffffff;" onclick="setDoorColor('#ffffff', 'Biały', 2600, this)"></div>
        </div>

        <button class="btn-confirm" onclick="confirmSelection()">✅ ZATWIERDŹ WYBÓR</button>
    </div>

    <script>
        let currentSelection = { n: "Drzwi door (Antracyt)", p: 2850 };

        function setDoorColor(hex, name, price, el) {
            currentSelection = { n: "Drzwi door (" + name + ")", p: price };
            const mv = document.querySelector('#doorModel');
            
            if (mv.model) {
                mv.model.materials.forEach(mat => {
                    if (!mat.name.toLowerCase().includes('handle')) {
                        mat.pbrMetallicRoughness.setBaseColorFactor(hex);
                    }
                });
            }
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        
          function runMeasure() {
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

    if (isIOS) {
        // Próba 1: Bezpośrednie wywołanie aplikacji Miarka (najszybsze)
       <a href="apple-measure://">Otwórz Miarkę AR</a>

        // Próba 2: Jeśli powyższe nie zadziała w 500ms (np. stara wersja iOS), 
        // używamy alternatywnego protokołu systemowego
        setTimeout(() => {
            if (document.hasFocus()) {
                window.location.href = "nt-measure://";
            }
        }, 500);

    } else {
        // Obsługa Androida (jeśli chcesz)
        alert("Funkcja Miarka AR jest dostępna na urządzeniach iPhone.");
    }
}
        function confirmSelection() {
            let queue = JSON.parse(localStorage.getItem('services_queue') || "[]");
            queue.push(currentSelection);
            localStorage.setItem('services_queue', JSON.stringify(queue));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfigurator 3D AR | SERWIS-DRZWI.PRO</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #0f172a; color: white; font-family: sans-serif; height: 100vh; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
        .config-panel { position: absolute; left: 20px; top: 20px; width: 280px; background: rgba(30, 41, 59, 0.9); padding: 20px; border-radius: 20px; z-index: 100; border: 1px solid rgba(255,255,255,0.1); }
        .btn-ar { position: absolute; bottom: 30px; right: 30px; background: #2563eb; color: white; border: none; padding: 15px 25px; border-radius: 50px; font-weight: bold; cursor: pointer; z-index: 100; }
        .btn-save { width: 100%; background: #22c55e; color: white; border: none; padding: 12px; border-radius: 10px; margin-top: 20px; cursor: pointer; font-weight: bold; }
        .color-dot { width: 40px; height: 40px; border-radius: 50%; display: inline-block; cursor: pointer; border: 2px solid transparent; margin: 5px; }
        .color-dot.active { border-color: #38bdf8; }
    </style>
</head>
<body>

    <model-viewer id="doorModel"
        src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/DoorStatus/glTF-Binary/DoorStatus.glb" 
        ios-src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/DoorStatus/glTF-Binary/DoorStatus.usdz"
        ar
        ar-modes="webxr scene-viewer quick-look"
        camera-controls
        auto-rotate
        shadow-intensity="1">
        
        <button slot="ar-button" class="btn-ar">ZOBACZ W POKOJU (AR)</button>
    </model-viewer>

    <div class="config-panel">
        <h2 style="margin-top:0">Projektant 3D</h2>
        <p>Wybierz kolor:</p>
        <div class="color-dot active" style="background: #a67c52;" onclick="changeColor('#a67c52', 'Dąb', this)"></div>
        <div class="color-dot" style="background: #37474f;" onclick="changeColor('#37474f', 'Antracyt', this)"></div>
        <div class="color-dot" style="background: #5d4037;" onclick="changeColor('#5d4037', 'Orzech', this)"></div>
        
        <button class="btn-save" onclick="saveToOrder()">DODAJ DO WYCENY</button>
    </div>

    <script>
        let selectedColor = "Dąb";

        function changeColor(hex, name, el) {
            selectedColor = name;
            const mv = document.querySelector('#doorModel');
            if (mv.model) {
                // Szukamy materiału o nazwie Door (w tym konkretnym modelu Google)
                const mat = mv.model.materials.find(m => m.name.toLowerCase().includes('door'));
                if (mat) mat.pbrMetallicRoughness.setBaseColorFactor(hex);
            }
            document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        function saveToOrder() {
            const data = {
                nazwa: "Drzwi Modern",
                opis: "Kolor: " + selectedColor,
                cena: 3100
            };
            // Używamy klucza 'nowyElementKosztorysu', aby index.html to "złapał"
            localStorage.setItem('nowyElementKosztorysu', JSON.stringify(data));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

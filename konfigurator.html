<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Konfigurator AR | door</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --blue: #2563eb; --green: #22c55e; }
        body { margin: 0; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; background: #f1f5f9; }
        
        /* Obszar 3D - przywróciłem ładne tło */
        model-viewer { 
            width: 100%; 
            flex-grow: 1; 
            background: radial-gradient(circle, #ffffff 0%, #cbd5e1 100%); 
            --poster-color: transparent;
        }

        /* Przycisk AR - wymuszamy widoczność, gdy AR jest dostępne */
        .btn-ar {
            position: absolute; top: calc(env(safe-area-inset-top) + 20px);
            right: 20px; background: var(--blue); color: white;
            border: none; padding: 15px 25px; border-radius: 50px;
            font-weight: bold; cursor: pointer; z-index: 1000;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Panel dolny */
        .ui-panel {
            padding: 25px; background: white; border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }
        .color-grid { display: flex; gap: 15px; margin: 15px 0; justify-content: center; }
        .dot { width: 50px; height: 50px; border-radius: 12px; cursor: pointer; border: 3px solid #eee; }
        .dot.active { border-color: var(--blue); }
        .btn-main { 
            width: 100%; background: var(--green); color: white; border: none; 
            padding: 20px; border-radius: 15px; font-weight: 800; font-size: 16px;
        }
    </style>
</head>
<body>

    <model-viewer id="doorModel" 
        src="door.glb" 
        ios-src="door.usdz" 
        ar ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        ar-scale="fixed"
        shadow-intensity="2">
        
        <button slot="ar-button" class="btn-ar">📏 OTWÓRZ MIARKĘ AR</button>
    </model-viewer>

    <div class="ui-panel">
        <div class="color-grid">
            <div class="dot active" style="background: #2c2c2c;" onclick="paint('#2c2c2c', 'Antracyt', 2850, this)"></div>
            <div class="dot" style="background: #5d4037;" onclick="paint('#5d4037', 'Orzech', 2700, this)"></div>
            <div class="dot" style="background: #a67c52;" onclick="paint('#a67c52', 'Dąb Złoty', 2750, this)"></div>
            <div class="dot" style="background: #ffffff;" onclick="paint('#ffffff', 'Biały', 2600, this)"></div>
        </div>
        <button class="btn-main" onclick="sendToService()">✅ ZATWIERDŹ WYBÓR</button>
    </div>

    <script>
        let currentData = { n: "Drzwi door (Antracyt)", p: 2850 };

        function paint(hex, name, price, el) {
            currentData = { n: "Drzwi door (" + name + ")", p: price };
            const mv = document.querySelector('#doorModel');
            if (mv.model) {
                mv.model.materials.forEach(mat => {
                    // Maluje wszystko oprócz klamki (jeśli klamka ma w nazwie 'handle' lub 'klamka')
                    if (!mat.name.toLowerCase().includes('handle') && !mat.name.toLowerCase().includes('klamka')) {
                        mat.pbrMetallicRoughness.setBaseColorFactor(hex);
                    }
                });
            }
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
        }

        function sendToService() {
            let queue = JSON.parse(localStorage.getItem('services_queue') || "[]");
            queue.push(currentData);
            localStorage.setItem('services_queue', JSON.stringify(queue));
            window.location.href = 'wersja 1.85.html';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Konfigurator</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 50px; }
        .door { width: 200px; height: 400px; background: #444; margin: 20px auto; border: 5px solid #222; transition: 0.3s; }
        .controls { background: #1e293b; padding: 20px; border-radius: 20px; display: inline-block; }
        button { padding: 10px 20px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Zaprojektuj swoje drzwi</h1>
    <div class="door" id="preview"></div>
    
    <div class="controls">
        <p>Wybierz kolor:</p>
        <button onclick="set('Brązowe', '#8b4513', 1500)">Brązowe (1500zł)</button>
        <button onclick="set('Antracyt', '#2d3748', 1700)">Antracyt (1700zł)</button>
        <button onclick="set('Białe', '#f8fafc', 1400)">Białe (1400zł)</button>
        <br><br>
        <button onclick="save()" style="background: #22c55e; color: white; font-weight: bold; padding: 15px;">DODAJ DO ZLECENIA</button>
    </div>

    <script>
        let current = { kolor: 'Standard', kod: '#444', cena: 1200 };

        function set(k, hex, c) {
            current = { kolor: k, kod: hex, cena: c };
            document.getElementById('preview').style.background = hex;
        }

        function save() {
            localStorage.setItem('zapisaneDrzwi', JSON.stringify(current));
            window.location.href = "index.html"; // wracamy na główną
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERWIS-DRZWI.PRO | Profesjonalny Panel Zleceń</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --primary: #2563eb; --accent: #38bdf8; --bg: #0f172a; 
            --card: rgba(30, 41, 59, 0.7); --text: #f8fafc; --success: #22c55e;
        }
        .light-mode { --bg: #f8fafc; --card: rgba(255, 255, 255, 0.9); --text: #0f172a; }
        
        body { margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); scroll-behavior: smooth; transition: 0.5s; }
        
        nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); position: fixed; width: 90%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 22px; font-weight: 800; color: var(--accent); text-decoration: none; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 13px; text-transform: uppercase; font-weight: 700; }

        .section { padding: 100px 8%; }
        
        .hero { 
            height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
        .btn-main { background: var(--primary); color: white; padding: 18px 35px; border-radius: 12px; font-weight: 800; text-decoration: none; transition: 0.3s; display: inline-block; }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4); }

        .asystent-container { 
            background: var(--card); border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); 
            padding: 40px; backdrop-filter: blur(20px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        .asystent-grid { display: grid; grid-template-columns: 1fr 1.2fr 0.8fr; gap: 30px; }

        .diag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .diag-card { 
            background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid transparent;
            cursor: pointer; transition: 0.2s; text-align: center; font-size: 14px; color: var(--text);
        }
        .diag-card:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
        .diag-card i { font-size: 20px; color: var(--accent); margin-bottom: 10px; display: block; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 11px; text-transform: uppercase; margin-bottom: 5px; opacity: 0.7; font-weight: 700; }
        input, select, textarea { 
            width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1); 
            color: white; padding: 12px; border-radius: 10px; box-sizing: border-box; font-family: inherit;
        }
        .light-mode input, .light-mode select { color: #000; background: #fff; border: 1px solid #ccc; }

        #selectedServices { list-style: none; padding: 0; margin: 15px 0; }
        .service-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 10px; margin-bottom: 8px; font-size: 13px;
            border-left: 4px solid var(--accent);
        }
        .remove-svc { color: #ef4444; cursor: pointer; font-size: 16px; }

        .summary-box { 
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.1) 0%, rgba(0,0,0,0.3) 100%);
            padding: 25px; border-radius: 20px; border: 1px solid var(--primary);
        }
        .price-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; opacity: 0.8; }
        .price-total { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; margin-top: 15px; display: flex; justify-content: space-between; font-weight: 800; font-size: 24px; color: var(--accent); }

        #map { height: 280px; border-radius: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); z-index: 1; }

        @media (max-width: 1100px) { .asystent-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<nav>
    <a href="#" class="logo"><i class="fas fa-toolbox"></i> SERWIS-DRZWI.PRO</a>
    <div class="nav-links">
        <a href="#home">Start</a>
        <a href="#kalendarz">Zlecenie</a>
        <button onclick="document.body.classList.toggle('light-mode')" style="background:none; border:none; color:var(--accent); cursor:pointer;"><i class="fas fa-adjust"></i></button>
    </div>
</nav>

<section class="hero" id="home">
    <h1>System Zarządzania Serwisem</h1>
    <p style="margin: 20px 0 30px 0; opacity: 0.8;">Wirtualizacja 3D i automatyczny kosztorys w jednym miejscu.</p>
    <a href="konfigurator.html" class="btn-main"><i class="fas fa-door-open"></i> OTWÓRZ PROJEKTANT 3D</a>
</section>

<section class="section" id="kalendarz">
    <div class="asystent-container">
        <h2 style="margin-top:0; text-align:center; font-weight:800;"><i class="fas fa-calculator" style="color:var(--accent);"></i> ASYSTENT WYCENY 4.0</h2>
        
        <div class="asystent-grid">
            <div class="column">
                <h3 style="font-size: 14px; letter-spacing: 1px;">DANE KLIENTA</h3>
                <div class="form-group"><input type="text" id="cName" placeholder="Imię i Nazwisko"></div>
                <div class="form-group"><input type="text" id="cPhone" placeholder="Telefon"></div>
                <div class="form-group"><input type="email" id="cEmail" placeholder="E-mail"></div>
                <div class="form-group">
                    <input type="text" id="cStreet" placeholder="Ulica i nr + ENTER" onkeydown="if(event.key==='Enter') searchLoc()">
                </div>
                <div class="form-group">
                    <input type="text" id="cCity" placeholder="Miejscowość + ENTER" onkeydown="if(event.key==='Enter') searchLoc()">
                </div>
            </div>

            <div class="column">
                <h3 style="font-size: 14px; letter-spacing: 1px;">USŁUGI SERWISOWE</h3>
                <div class="diag-grid">
                    <div class="diag-card" onclick="addService('Regulacja serwisowa', 150)"><i class="fas fa-tools"></i>Regulacja</div>
                    <div class="diag-card" onclick="addService('Montaż kompletny', 450)"><i class="fas fa-box"></i>Montaż</div>
                    <div class="diag-card" onclick="addService('Wymiana zamka', 200)"><i class="fas fa-key"></i>Zamek</div>
                    <div class="diag-card" onclick="addService('Utylizacja oścież.', 100)"><i class="fas fa-trash"></i>Utylizacja</div>
                </div>
                
                <div class="form-group">
                    <label>Wybierz Piętro</label>
                    <select id="floorSelect" onchange="updateSummary()">
                        <option value="0">Parter / Winda (0 zł)</option>
                        <script>for(let i=1; i<=10; i++) document.write(`<option value="${i*50}">${i}. Piętro (+${i*50} zł)</option>`);</script>
                    </select>
                </div>
                <textarea id="cNotes" rows="3" placeholder="Dodatkowe uwagi techniczne..."></textarea>
            </div>

            <div class="column">
                <div id="map"></div>
                <div class="summary-box">
                    <div id="selectedServices"></div>
                    <div class="price-row"><span>Dojazd:</span> <span id="distPrice">0 zł</span></div>
                    <div class="price-row"><span>Wnoszenie:</span> <span id="floorPrice">0 zł</span></div>
                    <div class="price-total"><span>SUMA:</span> <span id="sumTotal">0 zł</span></div>
                    <button class="btn-main" style="width:100%; margin-top:15px; border:none;" onclick="window.print()">GENERUJ PROTOKÓŁ PDF</button>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const companyLoc = [52.2297, 21.0122];
    let distancePrice = 0, selectedServices = [];
    const map = L.map('map', { zoomControl: false }).setView(companyLoc, 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker;

    // SZUKANIE ADRESU
    async function searchLoc() {
        const addr = document.getElementById('cStreet').value + " " + document.getElementById('cCity').value;
        if(addr.length < 5) return;
        try {
            const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(addr)}`);
            const d = await r.json();
            if(d.length > 0) {
                const pos = [d[0].lat, d[0].lon];
                if(marker) marker.setLatLng(pos); else marker = L.marker(pos).addTo(map);
                map.setView(pos, 14);
                distancePrice = Math.max(50, Math.round((map.distance(companyLoc, pos)/1000) * 3));
                updateSummary();
            }
        } catch(e) {}
    }

    function addService(name, price) {
        selectedServices.push({ name, price });
        updateSummary();
    }

    function removeService(i) {
        selectedServices.splice(i, 1);
        updateSummary();
    }

    function updateSummary() {
        const floor = parseInt(document.getElementById('floorSelect').value);
        const sSum = selectedServices.reduce((a, b) => a + b.price, 0);
        
        document.getElementById('selectedServices').innerHTML = selectedServices.map((s, i) => `
            <div class="service-item">
                <span>${s.name}</span>
                <b>${s.price} zł <i class="fas fa-times-circle remove-svc" onclick="removeService(${i})"></i></b>
            </div>
        `).join('');

        document.getElementById('distPrice').innerText = distancePrice + " zł";
        document.getElementById('floorPrice').innerText = floor + " zł";
        document.getElementById('sumTotal').innerText = (distancePrice + floor + sSum) + " zł";
    }

    // POBIERANIE DANYCH Z KONFIGURATORA
    window.addEventListener('load', () => {
        const saved = localStorage.getItem('nowyElementKosztorysu');
        if(saved) {
            const data = JSON.parse(saved);
            addService(data.nazwa + " (" + data.opis + ")", data.cena);
            localStorage.removeItem('nowyElementKosztorysu'); // Czyścimy, żeby nie dodawało przy każdym odświeżeniu
        }
    });

    map.on('click', e => {
        if(marker) marker.setLatLng(e.latlng); else marker = L.marker(e.latlng).addTo(map);
        distancePrice = Math.max(50, Math.round((map.distance(companyLoc, e.latlng)/1000) * 3));
        updateSummary();
    });
</script>
</body>
</html>

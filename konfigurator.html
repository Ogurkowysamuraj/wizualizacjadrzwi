<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PRO-MONTAŻ AR | Miarka i Konfigurator</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root { --blue: #2563eb; --green: #22c55e; --bg: #f8fafc; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); height: 100vh; overflow: hidden; }
        
        model-viewer { width: 100%; height: 100%; background: #ffffff; }

        /* PRZYCISK AR U GÓRY (Bezpieczny dla iPhone 14) */
        .ar-trigger {
            position: absolute; top: calc(env(safe-area-inset-top) + 20px);
            right: 20px; z-index: 1000;
        }
        .btn-ar {
            background: var(--blue); color: white; border: none; padding: 15px 25px;
            border-radius: 50px; font-weight: bold; cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); display: flex; align-items: center; gap: 8px;
        }

        /* PANEL KONFIGURACJI NA DOLE */
        .ui-panel {
            position: absolute; bottom: 30px; left: 20px; right: 20px;
            background: white; padding: 25px; border-radius: 30px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.15); max-width: 500px; margin: 0 auto;
        }

        .title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .dots { display: flex; gap: 10px; }
        .dot { width: 45px; height: 45px; border-radius: 12px; cursor: pointer; border: 3px solid #f1f5f9; }
        .dot.active { border-color: var(--blue); transform: scale(1.1); }

        .btn-order {
            width: 100%; background: var(--green); color: white; border: none;
            padding: 18px; border-radius: 15px; font-weight: 800; cursor: pointer;
            font-size: 16px; margin-top: 15px; box-shadow: 0 5px 15px rgba(34, 197, 94, 0.3);
        }
    </style>
</head>
<body>

    <div class="ar-trigger">
        <button class="btn-ar" onclick="document.querySelector('#m').activateAR()">
            📏 PRZYMIERZ I ZMIERZ (AR)
        </button>
    </div>

    <model-viewer id="m" 
        src="door.glb" 
        ar ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate
        ar-scale="fixed"> </model-viewer>

    <div class="ui-panel">
        <div class="title-row">
            <h3 style="margin:0">Konfiguracja Montażu</h3>
            <span id="price-tag" style="font-weight:bold; color:var(--blue)">2850 zł</span>
        </div>
        <div class="dots">
            <div class="dot active" style="background: #2c2c2c;" onclick="paint('#2c2c2c', 'Antracyt', 2850, this)"></div>
            <div class="dot" style="background: #5d4037;" onclick="paint('#5d4037', 'Orzech', 2700, this)"></div>
            <div class="dot" style="background: #a67c52;" onclick="paint('#a67c52', 'Dąb Złocisty', 2750, this)"></div>
            <div class="dot" style="background: #ffffff;" onclick="paint('#ffffff', 'Biały', 2600, this)"></div>
        </div>
        <button class="btn-order" onclick="sendToMain()">✅ ZAMÓW BEZPŁATNY POMIAR</button>
    </div>

    <script>
        let current = { n: "Drzwi Modern (Antracyt)", p: 2850 };

        function paint(hex, name, price, el) {
            current = { n: "Drzwi Modern (" + name + ")", p: price };
            const mv = document.querySelector('#m');
            if (mv.model) {
                mv.model.materials.forEach(mat => {
                    if (mat.name.toLowerCase().includes('wood') || mat.name.toLowerCase().includes('door')) {
                        mat.pbrMetallicRoughness.setBaseColorFactor(hex);
                    }
                });
            }
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('price-tag').innerText = price + " zł";
        }

        function sendToMain() {
            // Wysyłamy do index.html przez localStorage
            let saved = JSON.parse(localStorage.getItem('services_queue') || "[]");
            saved.push(current);
            localStorage.setItem('services_queue', JSON.stringify(saved));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>

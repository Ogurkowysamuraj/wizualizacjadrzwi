<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wirtualizacja Drzwi | Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            overflow-x: hidden;
        }

        /* Navbar */
        nav {
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--glass);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 30px;
            transition: 0.3s;
            font-weight: 500;
        }

        .nav-links a:hover { color: var(--primary); }

        /* Slider */
        .slider-container {
            position: relative;
            width: 80%;
            margin: 50px auto;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .slider {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--glass);
            border: none;
            color: white;
            padding: 15px;
            cursor: pointer;
            border-radius: 50%;
        }

        .prev { left: 20px; }
        .next { right: 20px; }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .btn-main {
            background: var(--primary);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
            display: inline-block;
            margin: 10px;
        }

        .btn-main:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--primary); }

        /* Calendar Placeholder */
        .calendar-section {
            background: var(--glass);
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }

        input[type="date"] {
            padding: 10px;
            border-radius: 5px;
            border: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo"><i class="fas fa-door-open"></i> WIRTUALIZACJA DRZWI</div>
    <div class="nav-links">
        <a href="#onas">O nas</a>
        <a href="forum.html">Forum</a>
        <a href="#kontakt">Kontakt</a>
    </div>
</nav>

<section class="hero">
    <h1>Zaprojektuj swoje wejście do domu</h1>
    <p>Użyj naszego zaawansowanego konfiguratora 3D, aby wybrać idealne drzwi.</p>
    <a href="konfigurator.html" class="btn-main">URUCHOM WIZUALIZACJĘ 3D</a>
</section>

<div class="slider-container">
    <div class="slider" id="slider">
        <img src="https://images.unsplash.com/photo-1506377247377-2a5b3b0ca7df?auto=format&fit=crop&w=1200" class="slide" alt="Drzwi 1">
        <img src="https://images.unsplash.com/photo-1510076857177-7470076d4098?auto=format&fit=crop&w=1200" class="slide" alt="Drzwi 2">
        <img src="https://images.unsplash.com/photo-1481277542470-605612bd2d61?auto=format&fit=crop&w=1200" class="slide" alt="Drzwi 3">
    </div>
    <button class="slider-btn prev" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
    <button class="slider-btn next" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
</div>

<div class="calendar-section">
    <h3><i class="far fa-calendar-check"></i> Wybierz termin montażu</h3>
    <input type="date" id="montaz-date">
    <p id="status"></p>
</div>

<script>
    let currentSlide = 0;
    const slider = document.getElementById('slider');
    const slides = document.querySelectorAll('.slide');

    function moveSlide(direction) {
        currentSlide = (currentSlide + direction + slides.length) % slides.length;
        slider.style.transform = `translateX(-${currentSlide * 100}%)`;
    }

    // Auto-swipe co 5 sekund
    setInterval(() => moveSlide(1), 5000);

    // Prosta logika kalendarza
    document.getElementById('montaz-date').addEventListener('change', function() {
        const date = new Date(this.value);
        const day = date.getDay();
        if(day === 0 || day === 6) {
            document.getElementById('status').innerText = "Weekendy zajęte. Wybierz dzień roboczy.";
            document.getElementById('status').style.color = "#ff4444";
        } else {
            document.getElementById('status').innerText = "Termin dostępny!";
            document.getElementById('status').style.color = "#44ff44";
        }
    });
</script>

</body>
</html>

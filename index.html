<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wirtualizacja Drzwi | Oficjalna Strona</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #2563eb;
            --accent: #38bdf8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            scroll-behavior: smooth;
        }

        /* Nawigacja */
        nav {
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 90%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: var(--accent); }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .nav-links a:hover { color: var(--accent); }

        /* Hero & Slider */
        .hero {
            padding-top: 120px;
            text-align: center;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
        }

        .slider-container {
            position: relative;
            max-width: 1100px;
            margin: 40px auto;
            overflow: hidden;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .slider { display: flex; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { min-width: 100%; height: 500px; object-fit: cover; filter: brightness(0.7); }

        .slider-nav {
            position: absolute;
            top: 50%; width: 100%;
            display: flex; justify-content: space-between;
            transform: translateY(-50%); padding: 0 20px; box-sizing: border-box;
        }

        .s-btn {
            background: rgba(255,255,255,0.1); border: none; color: white;
            width: 50px; height: 50px; border-radius: 50%; cursor: pointer; backdrop-filter: blur(5px);
        }

        /* Sekcje */
        .section { padding: 80px 10%; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
        .about-img { width: 100%; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        /* Inteligentny Kalendarz i Mapa */
        .config-box {
            background: var(--card);
            padding: 40px;
            border-radius: 25px;
            border: 1px solid var(--primary);
        }

        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; text-align: left; }

        input[type="date"], input[type="text"] {
            background: var(--bg);
            border: 1px solid var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        #map { height: 350px; border-radius: 15px; border: 1px solid var(--accent); }

        .summary-card {
            background: rgba(37, 99, 235, 0.1);
            padding: 20px;
            border-radius: 15px;
            border-left: 5px solid var(--accent);
        }

        .btn-cta {
            background: var(--primary); color: white; padding: 18px 40px;
            border-radius: 12px; text-decoration: none; font-weight: bold;
            display: inline-block; transition: 0.3s; border: none; cursor: pointer;
            width: 100%; font-size: 16px;
        }
        .btn-cta:hover { background: var(--accent); transform: translateY(-3px); }

        /* Kontakt */
        .info-card { background: var(--card); padding: 30px; border-radius: 20px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">WIRTUALIZACJA DRZWI</div>
    <div class="nav-links">
        <a href="#home">Start</a>
        <a href="#onas">O nas</a>
        <a href="forum.html">Forum</a>
        <a href="#kalendarz">Terminy</a>
        <a href="#kontakt">Kontakt</a>
    </div>
</nav>

<section class="hero" id="home">

    <a href="konfigurator.html" class="btn-cta" style="width:auto; margin-bottom: 30px;">URUCHOM KONFIGURATOR 3D</a>

    <div class="slider-container">
        <div class="slider" id="mainSlider">
            <img src="https://images.unsplash.com/photo-1510076857177-7470076d4098?auto=format&fit=crop&w=1200" class="slide">
            <img src="https://images.unsplash.com/photo-1506377247377-2a5b3b0ca7df?auto=format&fit=crop&w=1200" class="slide">
            <img src="https://images.unsplash.com/photo-1481277542470-605612bd2d61?auto=format&fit=crop&w=1200" class="slide">
        </div>
        <div class="slider-nav">
            <button class="s-btn" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
            <button class="s-btn" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>
</section>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizualizator Drzwi</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #1a202c; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        .container { position: relative; width: 90%; max-width: 800px; height: 80vh; background: #fff; border-radius: 20px; overflow: hidden; }
        model-viewer { width: 100%; height: 100%; background-color: #eee; 
            --poster-color: transparent; }
        /* Tło jako obrazek pod modelem */
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            object-fit: cover; z-index: 0; }
        model-viewer { position: relative; z-index: 1; }
    </style>
</head>
<body>

<div class="container">
    <img src="pokoj.jpg" class="bg-image">
    
    <model-viewer 
        src="drzwiztekstura.glb" 
        camera-controls 
        touch-action="pan-y" 
        auto-rotate 
        shadow-intensity="1" 
        exposure="1.5" 
        environment-image="neutral"
        alt="Model 3D drzwi">
    </model-viewer>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wizualizator Drzwi - Pełna Interakcja</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #1a202c; font-family: sans-serif; color: white; display: flex; flex-direction: column; align-items: center; }
        .controls-panel { background: rgba(45, 55, 72, 0.9); padding: 20px; border-radius: 15px; margin: 20px; width: 90%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; background: #4a5568; color: white; cursor: pointer; flex: 1; transition: 0.2s; }
        button.active { background: #3182ce; font-weight: bold; }
        .btn-main { background: #38a169; font-weight: bold; text-transform: uppercase; padding: 18px; font-size: 16px; width: 100%; }
        .viewer-container { position: relative; width: 95%; max-width: 1100px; height: 75vh; border-radius: 20px; overflow: hidden; }
        .bg-image { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        model-viewer { position: absolute; width: 100%; height: 100%; z-index: 2; --poster-color: transparent; }
    </style>
</head>
<body>

    <div class="controls-panel">
        <div class="btn-group" id="handing-group">
            <button id="btn-L" class="active" onclick="setHanding('left', this)">Lewe</button>
            <button id="btn-P" onclick="setHanding('right', this)">Prawe</button>
        </div>
        <div class="btn-group" id="side-group">
            <button id="btn-pull" class="active" onclick="setSide('pull', this)">Do siebie</button>
            <button id="btn-push" onclick="setSide('push', this)">Od siebie</button>
        </div>
        <button class="btn-main" id="main-btn" onclick="toggleDoor()">OTWÓRZ DRZWI</button>
    </div>

    <div class="viewer-container">
        <img src="pokoj.jpg" class="bg-image">
        <model-viewer 
            id="door-model"
            src="drzwi1ruch.glb" 
            camera-orbit="0deg 88deg 4.2m"
            camera-target="0.1m 1.05m 0m"
            interaction-prompt="none"
            shadow-intensity="1">
        </model-viewer>
    </div>

    <script>
        const mv = document.querySelector("#door-model");
        const mainBtn = document.querySelector("#main-btn");
        
        let isOpen = false;
        let isLeft = true;
        let isPull = true;
        let isDragging = false;
        let startX = 0;

        // Ustawienia na podstawie Twoich klatek z Blendera
        const FRAME_OPEN_END = 80; // Klatka, w której drzwi są w pełni otwarte
        const FRAME_TOTAL = 250;   // Całkowita liczba klatek w Twoim pliku
        const FPS = 30;            // Standardowe klatki na sekundę

        function updateTransform() {
            let sX = isLeft ? "1" : "-1";
            // Fizyczny obrót modelu o 180 stopni
            mv.orientation = isPull ? "0 0 0deg" : "0 0 180deg";
            mv.scale = `${sX} 1 1`;
        }

        // --- RĘCZNE PRZESUWANIE (DRAGGING) ---
        mv.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            mv.pause();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging || !mv.duration) return;

            const deltaX = e.clientX - startX;
            // Czułość: przesunięcie o 200px na ekranie przejdzie przez połowę animacji
            const sensitivity = 0.005; 
            
            let newTime = mv.currentTime + (deltaX * sensitivity);
            
            // Ograniczamy czas do długości animacji
            mv.currentTime = Math.min(Math.max(newTime, 0), mv.duration);
            startX = e.clientX;

            // Jeśli przesunięte powyżej 0.5s, uznajemy za otwarte (UI)
            isOpen = mv.currentTime > 0.5;
            updateButtonUI();
        });

        function updateButtonUI() {
            if (isOpen) {
                mainBtn.textContent = "ZAMKNIJ DRZWI";
                mainBtn.style.background = "#e53e3e";
            } else {
                mainBtn.textContent = "OTWÓRZ DRZWI";
                mainBtn.style.background = "#38a169";
            }
        }

        // --- AUTOMATYCZNY PRZYCISK ---
        function toggleDoor() {
            if (!mv.duration) return;

            if (!isOpen) {
                // START OTWIERANIA (klatka 0 -> klamka -> skrzydło)
                mv.currentTime = 0;
                mv.play();
                isOpen = true;
                
                // Obliczamy czas zatrzymania: (klatka 80 / 250 klatek) * całkowity czas w sekundach
                const stopTime = (FRAME_OPEN_END / FRAME_TOTAL) * mv.duration;
                
                const checkStop = setInterval(() => {
                    if (mv.currentTime >= stopTime) {
                        mv.pause();
                        clearInterval(checkStop);
                    }
                }, 10);
            } else {
                // ZAMYKANIE (puszczamy animację od obecnego miejsca do końca)
                mv.play();
                isOpen = false;
                
                // Po dojściu do końca animacji (klatka 250) resetujemy na 0
                const checkEnd = setInterval(() => {
                    if (mv.currentTime >= mv.duration - 0.05) {
                        mv.pause();
                        mv.currentTime = 0;
                        clearInterval(checkEnd);
                    }
                }, 10);
            }
            updateButtonUI();
        }

        function setHanding(side, btn) {
            document.querySelectorAll('#handing-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isLeft = (side === 'left');
            updateTransform();
        }

        function setSide(dir, btn) {
            document.querySelectorAll('#side-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isPull = (dir === 'pull');
            updateTransform();
        }

        mv.addEventListener('load', () => {
            updateTransform();
            // Ustawiamy pierwszą klatkę jako poster
            mv.currentTime = 0;
            mv.pause();
        });
    </script>
</body>
</html>

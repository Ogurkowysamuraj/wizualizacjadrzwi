<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wizualizator Drzwi - Pełna Wersja</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #1a202c; font-family: sans-serif; color: white; display: flex; flex-direction: column; align-items: center; }
        .header { margin: 15px 0; text-align: center; }
        .controls-panel {
            background: rgba(45, 55, 72, 0.9);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        .btn-group { display: flex; justify-content: center; gap: 10px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4a5568;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
        }
        button.active { background: #3182ce; }
        .btn-main { background: #38a169; font-weight: bold; text-transform: uppercase; padding: 15px; }
        .viewer-container {
            position: relative;
            width: 95%;
            max-width: 1100px;
            height: 700px;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
        }
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        model-viewer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; --poster-color: transparent; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Wizualizator Drzwi Premium</h1>
    </div>

    <div class="controls-panel">
        <div class="btn-group" id="handing-group">
            <button id="btn-L" class="active" onclick="setHanding('left', this)">Lewe (Zawias L)</button>
            <button id="btn-P" onclick="setHanding('right', this)">Prawe (Zawias P)</button>
        </div>
        <div class="btn-group" id="side-group">
            <button id="btn-pull" class="active" onclick="setSide('pull', this)">Do siebie</button>
            <button id="btn-push" onclick="setSide('push', this)">Od siebie</button>
        </div>
        <button class="btn-main" id="main-btn" onclick="handleDoor()">OTWÓRZ DRZWI</button>
    </div>

    <div class="viewer-container">
        <img src="pokoj.jpg" class="bg-image">
        <model-viewer 
            id="door-model"
            src="drzwi1ruch.glb" 
            shadow-intensity="1" 
            exposure="1" 
            environment-image="neutral"
            camera-orbit="0deg 88deg 4.2m"
            camera-target="0.5m 1.05m 0m"
            interaction-prompt="none">
        </model-viewer>
    </div>

    <script>
        const mv = document.querySelector("#door-model");
        const mainBtn = document.querySelector("#main-btn");
        
        let isLeft = true;
        let isPull = true;
        let isMoving = false;
        let waitTimer;

        function updateModelScale() {
            // Poprawiona logika kierunków:
            // Jeśli Lewe -> skala X = 1, Jeśli Prawe -> skala X = -1
            let scaleX = isLeft ? "1" : "-1";
            let scaleZ = isPull ? "1" : "-1";
            mv.scale = `${scaleX} 1 ${scaleZ}`;
        }

        function handleDoor() {
            if (isMoving) return;
            
            const anims = mv.availableAnimations;
            if (anims.length > 0) {
                isMoving = true;
                mv.animationName = anims[0];
                mv.play();
                mainBtn.textContent = "DRZWI OTWARTE...";
                mainBtn.style.background = "#4a5568";

                // Zatrzymanie na końcu animacji (ok. 1.5s)
                clearTimeout(waitTimer);
                waitTimer = setTimeout(() => {
                    mv.pause();
                    
                    // Czekanie 5 sekund w pozycji otwartej
                    waitTimer = setTimeout(() => {
                        mv.currentTime = 0;
                        mainBtn.textContent = "OTWÓRZ DRZWI";
                        mainBtn.style.background = "#38a169";
                        isMoving = false;
                    }, 5000);

                }, 1500); 
            }
        }

        function setHanding(side, btn) {
            document.querySelectorAll('#handing-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isLeft = (side === 'left');
            updateModelScale();
        }

        function setSide(dir, btn) {
            document.querySelectorAll('#side-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isPull = (dir === 'pull');
            updateModelScale();
        }

        // Inicjalizacja przy starcie
        window.addEventListener('load', updateModelScale);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wirtualizacja Drzwi | Oficjalna Strona</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary: #2563eb;
            --accent: #38bdf8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); scroll-behavior: smooth; }

        /* Nawigacja */
        nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); position: fixed; width: 90%; top: 0; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 20px; font-weight: 700; color: var(--accent); }
        .nav-links a { color: white; text-decoration: none; margin-left: 25px; font-size: 14px; text-transform: uppercase; transition: 0.3s; }

        /* Hero & Slider */
        .hero { padding-top: 120px; text-align: center; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); }
        .slider-container { position: relative; max-width: 1000px; margin: 40px auto; overflow: hidden; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .slider { display: flex; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide { min-width: 100%; height: 450px; object-fit: cover; filter: brightness(0.6); }

        /* Konfigurator Box */
        .section { padding: 60px 10%; }
        .config-box { background: var(--card); padding: 40px; border-radius: 25px; border: 1px solid var(--primary); }
        .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; text-align: left; }

        input, select { background: var(--bg); border: 1px solid var(--primary); color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; margin: 10px 0; }

        /* Checkboxy */
        .services-list { background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; margin-top: 15px; }
        .service-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; }
        .service-item input { width: auto; margin: 0; }

        /* Godziny */
        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .time-btn { background: var(--bg); border: 1px solid var(--primary); color: white; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .time-btn.active { background: var(--primary); border-color: var(--accent); }
        .time-btn.disabled { opacity: 0.3; cursor: not-allowed; background: #450a0a; color: #ff4444; }

        #map { height: 450px; border-radius: 15px; border: 1px solid var(--accent); }

        /* Podsumowanie */
        .summary-card { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 25px; border-radius: 20px; border: 1px solid var(--accent); margin-top: 20px; }
        .btn-cta { background: var(--primary); color: white; padding: 18px; border-radius: 12px; border: none; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn-cta:hover { background: var(--accent); transform: translateY(-2px); }
        .btn-print { background: #475569; margin-top: 10px; }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; color: black !important; background: white !important; padding: 40px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="logo"><i class="fas fa-door-closed"></i> WIRTUALIZACJA DRZWI</div>
    <div class="nav-links">
        <a href="#home">Start</a>
        <a href="#onas">O nas</a>
        <a href="forum.html">Forum</a>
        <a href="#kalendarz">Rezerwacja</a>
    </div>
</nav>

<section class="hero" id="home">
    <h1>System Zarządzania Montażem</h1>
    <p>Skonfiguruj zlecenie, wybierz termin i wygeneruj kartę pracy.</p>
    
    <div class="slider-container">
        <div class="slider" id="mainSlider">
            <img src="https://images.unsplash.com/photo-1510076857177-7470076d4098?auto=format&fit=crop&w=1200" class="slide">
            <img src="https://images.unsplash.com/photo-1506377247377-2a5b3b0ca7df?auto=format&fit=crop&w=1200" class="slide">
        </div>
    </div>
</section>

<section class="section" id="kalendarz">
    <div class="config-box" id="printArea">
        <h2 style="text-align: center;"><i class="fas fa-file-invoice"></i> Karta Zlecenia Montażowego</h2>
        
        <div class="calc-grid">
            <div>
                <label><strong>1. Dane i Termin</strong></label>
                <input type="date" id="visitDate">
                <div class="time-grid" id="timeSlots"></div>
                
                <label style="display:block; margin-top:20px;"><strong>2. Usługi Dodatkowe (Wybierz):</strong></label>
                <div class="services-list">
                    <label class="service-item"><input type="checkbox" class="srv" data-price="100" value="Demontaż starych drzwi"> Demontaż starych drzwi (+100 zł)</label>
                    <label class="service-item"><input type="checkbox" class="srv" data-price="50" value="Wniesienie (brak windy)"> Wniesienie - za każde piętro (+50 zł)</label>
                    <label class="service-item"><input type="checkbox" class="srv" data-price="150" value="Utylizacja skrzydeł"> Utylizacja starych skrzydeł (+150 zł)</label>
                    <label class="service-item"><input type="checkbox" class="srv" data-price="80" value="Podcięcie skrzydła"> Podcięcie skrzydła na wymiar (+80 zł)</label>
                </div>

                <label style="display:block; margin-top:20px;"><strong>3. Miejscowość / Ulica:</strong></label>
                <input type="text" id="cityInput" placeholder="Wpisz miasto lub kliknij mapę">
            </div>

            <div>
                <div id="map"></div>
                
                <div class="summary-card">
                    <h4 style="margin:0 0 10px 0; color:var(--accent);">PODSUMOWANIE DLA MONTAŻYSTY:</h4>
                    <p style="font-size: 14px; margin: 5px 0;">Data: <span id="sumDate">-</span> | Godz: <span id="sumTime">-</span></p>
                    <p style="font-size: 14px; margin: 5px 0;">Dystans: <span id="sumDist">0 km</span></p>
                    <p style="font-size: 14px; margin: 5px 0;">Dodatki: <span id="sumSrv">-</span></p>
                    <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1);">
                    <h2 style="margin:10px 0 0 0;">SUMA: <span id="sumTotal" style="color:var(--accent);">0 zł</span></h2>
                </div>
            </div>
        </div>

        <button class="btn-cta" onclick="confirmOrder()">ZATWIERDŹ I WYŚLIJ ZLECENIE</button>
        <button class="btn-cta btn-print" onclick="window.print()"><i class="fas fa-print"></i> DRUKUJ KARTĘ PRACY DLA MONTAŻYSTY</button>
    </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Konfiguracja
    const companyLoc = [52.2297, 21.0122];
    let distancePrice = 0;
    let selectedTime = null;
    const occupied = {"2024-05-24": ["11:00"]}; // Przykład zajętego terminu

    // Mapa
    const map = L.map('map').setView(companyLoc, 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.marker(companyLoc).addTo(map).bindPopup('BIURO');
    let clientMarker;

    // Obsługa Godzin
    function genHours(date) {
        const slots = ["08:00", "11:00", "14:00"];
        const container = document.getElementById('timeSlots');
        container.innerHTML = '';
        slots.forEach(t => {
            const btn = document.createElement('button');
            btn.className = 'time-btn';
            btn.innerText = t;
            if(occupied[date] && occupied[date].includes(t)) {
                btn.className += ' disabled';
                btn.innerText += " (Zajęte)";
            } else {
                btn.onclick = () => {
                    document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    selectedTime = t;
                    calcAll();
                };
            }
            container.appendChild(btn);
        });
    }

    // Główne przeliczenia
    function calcAll() {
        // 1. Dystans
        let total = distancePrice;
        
        // 2. Dodatki
        let srvNames = [];
        document.querySelectorAll('.srv:checked').forEach(s => {
            total += parseInt(s.dataset.price);
            srvNames.push(s.value);
        });

        // 3. Widok
        document.getElementById('sumTotal').innerText = total + " zł";
        document.getElementById('sumDate').innerText = document.getElementById('visitDate').value;
        document.getElementById('sumTime').innerText = selectedTime || "-";
        document.getElementById('sumSrv').innerText = srvNames.length > 0 ? srvNames.join(", ") : "Brak";
    }

    map.on('click', e => {
        if(clientMarker) clientMarker.setLatLng(e.latlng);
        else clientMarker = L.marker(e.latlng).addTo(map);
        
        const dist = (map.distance(companyLoc, e.latlng) / 1000).toFixed(1);
        document.getElementById('sumDist').innerText = dist + " km";
        
        if (dist <= 10) distancePrice = 50;
        else if (dist <= 20) distancePrice = 70;
        else if (dist <= 100) distancePrice = 100;
        else distancePrice = 150;
        
        calcAll();
    });

    document.getElementById('visitDate').onchange = (e) => {
        genHours(e.target.value);
        calcAll();
    };
    document.querySelectorAll('.srv').forEach(s => s.onchange = calcAll);

    function confirmOrder() {
        if(!selectedTime) alert("Wybierz godzinę!");
        else alert("Zlecenie zapisane w systemie. Możesz teraz wydrukować kartę pracy.");
    }

    // Slider
    let curr = 0;
    setInterval(() => {
        curr = (curr + 1) % 2;
        document.getElementById('mainSlider').style.transform = `translateX(-${curr * 100}%)`;
    }, 5000);
</script>

</body>
</html>

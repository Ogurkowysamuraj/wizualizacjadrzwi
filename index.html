<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Wizualizator Drzwi - Finał</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #1a202c; font-family: sans-serif; color: white; display: flex; flex-direction: column; align-items: center; }
        .controls-panel { background: rgba(45, 55, 72, 0.9); padding: 20px; border-radius: 15px; margin: 20px; width: 90%; max-width: 600px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        .btn-group { display: flex; gap: 10px; }
        button { padding: 10px; border: none; border-radius: 8px; background: #4a5568; color: white; cursor: pointer; flex: 1; }
        button.active { background: #3182ce; }
        .btn-main { background: #38a169; font-weight: bold; padding: 15px; text-transform: uppercase; }
        .viewer-container { position: relative; width: 95%; max-width: 1100px; height: 75vh; border-radius: 20px; overflow: hidden; }
        .bg-image { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        model-viewer { position: absolute; width: 100%; height: 100%; z-index: 2; --poster-color: transparent; }
    </style>
</head>
<body>

    <div class="controls-panel">
        <div class="btn-group">
            <button id="btn-L" class="active" onclick="setHanding('left')">Lewe</button>
            <button id="btn-P" onclick="setHanding('right')">Prawe</button>
        </div>
        <button class="btn-main" id="main-button" onclick="handleDoorAction()">OTWÓRZ DRZWI</button>
    </div>

    <div class="viewer-container">
        <img src="pokoj.jpg" class="bg-image">
        <model-viewer 
            id="door-model"
            src="drzwi1ruch.glb" 
            camera-orbit="-2deg 88deg 4m" 
            camera-target="0.1m 1.05m 0m" 
            field-of-view="22deg"
            interaction-prompt="none"
            shadow-intensity="1">
        </model-viewer>
    </div>

    <script>
        const mv = document.querySelector("#door-model");
        const btn = document.querySelector("#main-button");
        let isMoving = false;

        function handleDoorAction() {
            if (isMoving) return;
            isMoving = true;

            const anims = mv.availableAnimations;
            if (anims.length > 0) {
                mv.animationName = anims[0];
                mv.play();
                btn.textContent = "DRZWI OTWARTE...";
                btn.style.background = "#4a5568";

                // Po 1.5s (czas animacji) zatrzymaj na 5 sekund
                setTimeout(() => {
                    mv.pause();
                    
                    setTimeout(() => {
                        // Powrót do zamkniętych
                        mv.currentTime = 0;
                        btn.textContent = "OTWÓRZ DRZWI";
                        btn.style.background = "#38a169";
                        isMoving = false;
                    }, 5000); // 5 sekund czekania

                }, 1500); // Czas trwania animacji otwierania
            }
        }

        function setHanding(side) {
            if (side === 'left') {
                mv.scale = "-1 1 1";
                document.querySelector("#btn-L").classList.add("active");
                document.querySelector("#btn-P").classList.remove("active");
            } else {
                mv.scale = "1 1 1";
                document.querySelector("#btn-P").classList.add("active");
                document.querySelector("#btn-L").classList.remove("active");
            }
        }

        // Ustawienie początkowe
        window.addEventListener('load', () => { mv.scale = "-1 1 1"; });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizualizator Drzwi Premium</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #1a202c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; }
        .header { margin: 20px 0; text-align: center; }
        .controls-panel {
            background: rgba(45, 55, 72, 0.9);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .btn-group { display: flex; justify-content: center; gap: 10px; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4a5568;
            color: white;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
        }
        button.active { background: #3182ce; }
        button:hover { background: #2d3748; }
        .btn-main { background: #38a169; font-weight: bold; text-transform: uppercase; padding: 15px; }
        .viewer-container {
            position: relative;
            width: 95%;
            max-width: 1100px;
            height: 700px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }
        .bg-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        model-viewer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; --poster-color: transparent; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Wizualizator Drzwi Premium</h1>
    </div>

    <div class="controls-panel">
        <div class="btn-group" id="handing-group">
            <button class="active" onclick="setHanding('left', this)">Lewe (Zawias L)</button>
            <button onclick="setHanding('right', this)">Prawe (Zawias P)</button>
        </div>
        <div class="btn-group" id="side-group">
            <button class="active" onclick="setSide('pull', this)">Do siebie</button>
            <button onclick="setSide('push', this)">Od siebie</button>
        </div>
        <button class="btn-main" onclick="toggleDoor()">OTWÓRZ DRZWI</button>
    </div>

    <div class="viewer-container">
        <img src="pokoj.jpg" class="bg-image" alt="Tło pokoju">
        
        <model-viewer 
            id="door-model"
            src="drzwi20.glb" 
            shadow-intensity="1" 
            exposure="1" 
            environment-image="neutral"
            camera-orbit="0deg 85deg 4.5m"
            field-of-view="20deg"
            camera-target="1.3m 1m 0m"
            interaction-prompt="none"
            alt="Interaktywne drzwi">
        </model-viewer>
    </div>

    <script>
        const modelViewer = document.querySelector("#door-model");
        const mainBtn = document.querySelector(".btn-main");
        
        let isOpen = false;
        let isLeft = true;
        let isPull = true;

        function toggleDoor() {
            // Pobiera nazwę pierwszej animacji znalezionej w Twoim pliku .glb
            const animations = modelViewer.availableAnimations;

            if (!isOpen) {
                if (animations.length > 0) {
                    modelViewer.animationName = animations[0];
                    modelViewer.play();
                }
                mainBtn.textContent = "ZAMKNIJ DRZWI";
                mainBtn.style.background = "#e53e3e";
                isOpen = true;
            } else {
                modelViewer.pause();
                modelViewer.currentTime = 0; // Powrót do klatki 1 (zamknięte)
                mainBtn.textContent = "OTWÓRZ DRZWI";
                mainBtn.style.background = "#38a169";
                isOpen = false;
            }
        }

        function setHanding(side, btn) {
            document.querySelectorAll('#handing-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isLeft = (side === 'left');
            updateModelScale();
        }

        function setSide(dir, btn) {
            document.querySelectorAll('#side-group button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            isPull = (dir === 'pull');
            updateModelScale();
        }

        function updateModelScale() {
            // Lustrzane odbicie modelu
            let scaleX = isLeft ? "-1" : "1";
            let scaleZ = isPull ? "1" : "-1";
            modelViewer.scale = `${scaleX} 1 ${scaleZ}`;
        }

        window.addEventListener('load', updateModelScale);
    </script>
</body>
</html>

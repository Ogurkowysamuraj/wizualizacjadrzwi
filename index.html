<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>SERWIS-DRZWI.PRO | Główna</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 20px; }
        nav { background: #1e293b; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        nav a { color: #38bdf8; text-decoration: none; margin-right: 20px; font-weight: bold; }
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        #map { height: 200px; border-radius: 10px; margin-bottom: 10px; }
        .btn { background: #2563eb; color: white; padding: 15px; border: none; width: 100%; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .service-list { list-style: none; padding: 0; }
        .service-item { background: rgba(0,0,0,0.2); padding: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<nav>
    <a href="index.html">Główna</a>
    <a href="konfigurator.html" style="background: #2563eb; color: white; padding: 10px; border-radius: 5px;">OTWÓRZ KONFIGURATOR</a>
    <a href="forum.html">Forum</a>
</nav>

<div class="container">
    <div class="card">
        <h3>1. Dane klienta</h3>
        <input type="text" id="cName" placeholder="Imię i Nazwisko">
        <input type="text" id="cPhone" placeholder="Telefon">
        <input type="text" id="cStreet" placeholder="Ulica i numer">
        <input type="text" id="cCity" placeholder="Miasto">
        <h3>2. Usługi</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="addService('Montaż standard', 400)">Montaż (400zł)</button>
            <button onclick="addService('Serwis/Regulacja', 150)">Serwis (150zł)</button>
        </div>
    </div>

    <div class="card">
        <div id="map"></div>
        <h3>Podsumowanie</h3>
        <ul id="selectedServices" class="service-list"></ul>
        <div style="font-size: 20px; font-weight: bold; color: #38bdf8;">SUMA: <span id="sumTotal">0</span> zł</div>
        <button class="btn" onclick="window.print()">WYDRUKUJ ZLECENIE</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let services = [];
    let distPrice = 0;

    // Obsługa mapy
    const map = L.map('map').setView([52.23, 21.01], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker;

    map.on('click', e => {
        if(marker) marker.setLatLng(e.latlng); else marker = L.marker(e.latlng).addTo(map);
        distPrice = 50; // stała opłata za dojazd dla uproszczenia
        update();
    });

    function addService(name, price) {
        services.push({name, price});
        update();
    }

    function update() {
        const list = document.getElementById('selectedServices');
        const sSum = services.reduce((a, b) => a + b.price, 0);
        list.innerHTML = services.map(s => `<li class="service-item">${s.name} <span>${s.price} zł</span></li>`).join('');
        document.getElementById('sumTotal').innerText = sSum + distPrice;
    }

    // ODBIERANIE DANYCH Z KONFIGURATORA
    window.onload = function() {
        const saved = localStorage.getItem('zapisaneDrzwi');
        if (saved) {
            const dane = JSON.parse(saved);
            addService("Drzwi: " + dane.kolor, parseInt(dane.cena));
            localStorage.removeItem('zapisaneDrzwi'); // czyścimy pamięć
        }
    }
</script>
</body>
</html>

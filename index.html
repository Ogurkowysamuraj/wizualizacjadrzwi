<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. Audyt EKO
    function calculateEko() {
        const uOld = parseFloat(document.getElementById('uValueOld').value);
        const energy = parseFloat(document.getElementById('energyCost').value);
        const savings = (uOld - 0.9) * 2 * 15 * 4800 / 1000 * energy;
        document.getElementById('ekoResult').innerText = Math.round(savings) + " zł";
    }

    // 2. Mapa i Usługi
    const companyLoc = [52.2297, 21.0122];
    let distancePrice = 0, services = [];
    const map = L.map('map', { zoomControl: false }).setView(companyLoc, 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker;

    async function searchAddress() {
        const street = document.getElementById('cStreet').value;
        const city = document.getElementById('cCity').value;
        if (!street || !city) return;

        try {
            const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(street + ' ' + city)}`);
            const data = await resp.json();
            if (data.length > 0) {
                const pos = [data[0].lat, data[0].lon];
                if(marker) marker.setLatLng(pos); else marker = L.marker(pos).addTo(map);
                map.setView(pos, 14);
                const dist = (map.distance(companyLoc, pos) / 1000).toFixed(0);
                distancePrice = Math.max(50, dist * 3);
                update();
            }
        } catch (e) { console.error(e); }
    }

    function toggleMap() {
        document.getElementById('mainGrid').classList.toggle('map-expanded');
        setTimeout(() => map.invalidateSize(), 500);
    }

    function addService(n, p) {
        services.push({n, p});
        update();
    }

    function removeService(i) {
        services.splice(i, 1);
        update();
    }

    function update() {
        const floor = parseInt(document.getElementById('floorSelect').value);
        const sSum = services.reduce((s, x) => s + x.p, 0);
        document.getElementById('serviceList').innerHTML = services.map((x, i) => `
            <div class="service-item">
                <span>${x.n}</span>
                <b>${x.p} zł <i class="fas fa-times-circle remove-btn" onclick="removeService(${i})"></i></b>
            </div>
        `).join('');
        document.getElementById('distPrice').innerText = distancePrice + " zł";
        document.getElementById('sumTotal').innerText = (distancePrice + floor + sSum) + " zł";
    }

    map.on('click', e => {
        if(marker) marker.setLatLng(e.latlng); else marker = L.marker(e.latlng).addTo(map);
        const dist = (map.distance(companyLoc, e.latlng) / 1000).toFixed(0);
        distancePrice = Math.max(50, dist * 3);
        update();
    });

    // 3. Integracja z Konfiguratorem i Strzałka
    window.addEventListener('load', () => {
        calculateEko();
        const queue = JSON.parse(localStorage.getItem('services_queue') || "[]");
        if (queue.length > 0) {
            queue.forEach(item => {
                services.push({ n: item.n, p: item.p });
            });
            localStorage.removeItem('services_queue');
            update();
            document.getElementById('kalendarz').scrollIntoView({ behavior: 'smooth' });
        }
    });

    window.onscroll = function() {
        const btn = document.getElementById('backToTop');
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            btn.style.display = "flex";
        } else {
            btn.style.display = "none";
        }
    };

    // Powiadomienia Live
    setInterval(() => {
        const towns = ["Warszawie", "Otwocku", "Piasecznie"];
        const n = document.getElementById('notification');
        document.getElementById('notif-text').innerText = `Nowe zlecenie w ${towns[Math.floor(Math.random()*3)]}!`;
        n.style.display = 'block';
        setTimeout(() => n.style.display = 'none', 4000);
    }, 25000);
</script>

<style>
    #backToTop {
        position: fixed; bottom: 30px; right: 30px;
        background: #2563eb; color: white; border: none;
        width: 50px; height: 50px; border-radius: 50%;
        cursor: pointer; z-index: 1000; display: none;
        align-items: center; justify-content: center; font-size: 24px;
        box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); transition: 0.3s;
    }
    #backToTop:hover { background: #1d4ed8; transform: translateY(-3px); }
</style>

<button id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">⬆</button>
</body>
</html>

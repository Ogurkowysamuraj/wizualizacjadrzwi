<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizualizator Drzwi Premium</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #1a202c; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; display: flex; flex-direction: column; align-items: center; }
        
        .header { margin: 20px 0; text-align: center; }
        
        /* Panel z przyciskami */
        .controls-panel {
            background: rgba(45, 55, 72, 0.8);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            width: 90%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .btn-group { display: flex; justify-content: center; gap: 10px; }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #4a5568;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button.active { background: #3182ce; }
        button:hover { background: #2d3748; }

        .btn-main {
            background: #38a169;
            font-weight: bold;
            text-transform: uppercase;
            padding: 15px;
        }

        /* Kontener na wizualizację */
        .viewer-container {
            position: relative;
            width: 90%;
            max-width: 1000px;
            height: 600px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        model-viewer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            --poster-color: transparent;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Wizualizator Drzwi Premium</h1>
    </div>

    <div class="controls-panel">
        <div class="btn-group">
            <button class="active">Lewe (Zawias L)</button>
            <button>Prawe (Zawias P)</button>
        </div>
        <div class="btn-group">
            <button class="active">Do siebie</button>
            <button>Od siebie</button>
        </div>
        <button class="btn-main">Otwórz / Zamknij Drzwi</button>
    </div>

    <div class="viewer-container">
        <img src="pokoj.jpg" class="bg-image" alt="Tło pokoju">
        
        <model-viewer 
            src="drzwiztekstura.glb" 
            camera-controls 
            touch-action="pan-y" 
            shadow-intensity="1.5" 
            exposure="1.2" 
            environment-image="neutral"
            camera-orbit="0deg 90deg 2m"
            alt="Interaktywny model 3D drzwi">
        </model-viewer>
    </div>

    <script>
        // Tutaj w przyszłości dodamy funkcje do przycisków
        console.log("Wizualizator gotowy!");
    </script>
</body>
</html>
